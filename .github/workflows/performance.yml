# Performance tests run post-merge on main and on demand via the Actions UI.
# They are not part of the PR gate: results on shared GitHub runners are too
# noisy to reliably catch regressions, and the ~3 min stage was the longest
# blocker on every PR. Maintainers investigating a suspect PR can dispatch
# this workflow against any branch from the Actions tab.
name: Benchmark Build Separation Evidence

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: 'Diagnostic smoke or preregistered four-job AB/BA comparison'
        type: choice
        options: [smoke, study]
        default: smoke
      debug:
        description: 'Maven debug for smoke only'
        type: boolean
        default: true

permissions:
  contents: read

# Single source of truth for the taxi-data window. The downloader (run via
# the test-data-setup module on cache miss) and the perf test both honor
# `perf.start` / `perf.end`; keeping the cache key aligned ensures we don't
# silently widen the window when the cache is regenerated.
#
# The taxi-data cache is restored and saved as separate steps so that the save
# only runs when the job succeeds. Actions cache entries are immutable, so a
# partial dataset persisted by a failed download would otherwise freeze under
# this key forever and break every later run (issue #588).
env:
  PERF_START: '2023-01'
  PERF_END: '2025-12'

jobs:
  performance-tests:
    name: ${{ matrix.sample.ordinal }} ${{ matrix.sample.arm }} pair ${{ matrix.sample.pair }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample: ${{ fromJSON(inputs.experiment == 'study' && '[{"arm":"before","pair":"1","ordinal":"1"},{"arm":"after","pair":"1","ordinal":"2"},{"arm":"after","pair":"2","ordinal":"3"},{"arm":"before","pair":"2","ordinal":"4"}]' || '[{"arm":"after","pair":"smoke","ordinal":"0"}]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 'Check out repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          submodules: 'true'

      - name: 'Set up Java'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0 — https://github.com/actions/setup-java/releases/tag/v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 'Cache Maven dependencies'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 — https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}-
            maven-${{ runner.os }}-

      - name: 'Restore taxi data cache'
        id: taxi-data-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 — https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: performance-testing/test-data-setup/target/tlc-trip-record-data/
          key: taxi-data-${{ env.PERF_START }}-to-${{ env.PERF_END }}

      - name: 'Cache Overture Maps data'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 — https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: performance-testing/test-data-setup/target/overture-maps-data/
          key: overture-maps-places-v1
          restore-keys: |
            overture-maps-places-

      - name: 'Install core, s3 and aws-auth into local repo'
        run: ./mvnw -B -DskipTests install -pl :hardwood-error-prone-checks,:hardwood-core,:hardwood-avro,:hardwood-s3,:hardwood-aws-auth -am

      - name: 'Run benchmark evidence collection'
        env:
          MAVEN_OPTS: '--add-modules jdk.incubator.vector'
          EXPERIMENT_ARM: ${{ matrix.sample.arm }}
          EXPERIMENT_PAIR: ${{ matrix.sample.pair }}
          EXPERIMENT_ORDINAL: ${{ matrix.sample.ordinal }}
          EXPERIMENT_DEBUG: ${{ inputs.experiment == 'smoke' && inputs.debug }}
        run: python3 tools/benchmark-build-separation-evidence.py

      - name: 'Retain evidence even on failure'
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-separation-${{ matrix.sample.ordinal }}-${{ matrix.sample.arm }}
          retention-days: 30
          path: |
            benchmark-evidence/
            performance-testing/end-to-end/target/surefire-reports/

      # Persist the taxi data only on success, and only when we actually had to
      # download it (a restore hit needs no re-save). This prevents a partial
      # dataset from a failed download being frozen under the immutable key.
      - name: 'Save taxi data cache'
        if: success() && steps.taxi-data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 — https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: performance-testing/test-data-setup/target/tlc-trip-record-data/
          key: taxi-data-${{ env.PERF_START }}-to-${{ env.PERF_END }}
